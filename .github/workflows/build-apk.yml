name: Build Ruang Usaha APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify and extract Android project
        run: |
          unzip -t RuangUsahaAndroid_Project.zip
          unzip -q RuangUsahaAndroid_Project.zip -d .
          test -f RuangUsahaAndroid/app/src/main/assets/index.html
          python3 - <<'PY'
          from pathlib import Path
          html = Path("RuangUsahaAndroid/app/src/main/assets/index.html")
          source = html.read_text()
          css = Path("android-mobile.css").read_text()
          if "Mobile-first Android layout improvements" not in source:
              source = source.replace("</style>", css + "\\n</style>", 1)
          html.write_text(source)
          java = Path("RuangUsahaAndroid/app/src/main/java/id/ruangkas/app/MainActivity.java")
          code = java.read_text()
          marker = "settings.setDomStorageEnabled(true);"
          extra = marker + "\\n        settings.setUseWideViewPort(true);\\n        settings.setLoadWithOverviewMode(false);\\n        settings.setTextZoom(100);\\n        settings.setSupportZoom(false);\\n        settings.setBuiltInZoomControls(false);\\n        settings.setDisplayZoomControls(false);"
          if "settings.setUseWideViewPort(true);" not in code:
              code = code.replace(marker, extra, 1)
          java.write_text(code)
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Locate Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon -p RuangUsahaAndroid assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RuangUsaha-debug-apk
          path: RuangUsahaAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
